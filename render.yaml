services:
  - type: web
    name: tapnod-demo
    runtime: node
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Customers, fingerprints, linked cards and notification subscriptions live here.
      - key: DATABASE_URL
        fromDatabase:
          name: tapnod-db
          property: connectionString
      - key: TOKEN_SECRET
        value: tapnod-demo-secret
      # Signs sign-in sessions and keeps notification keys stable. Render makes a random value once.
      - key: VAPID_SECRET
        generateValue: true
      # Demo shortcut: an unknown card is linked to the most recent sign-up. Set to empty to disable.
      - key: DEMO_AUTO_LINK
        value: latest
      # Nigerian voices. Paste your key from yarngpt.ai in the Render dashboard.
      - key: YARNGPT_API_KEY
        sync: false

databases:
  # Free Render Postgres: 1 GB, expires 30 days after creation (then a 14-day grace period).
  - name: tapnod-db
    plan: free
    databaseName: tapnod
    user: tapnod
