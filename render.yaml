services:
  - type: web
    name: tapnod-demo
    runtime: node
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Customers, fingerprints, linked cards and notification subscriptions live here.
      - key: DATABASE_URL
        fromDatabase:
          name: tapnod-db
          property: connectionString
      - key: TOKEN_SECRET
        value: tapnod-demo-secret
      # Signs sign-in sessions and keeps notification keys stable. Render makes a random value once.
      - key: VAPID_SECRET
        generateValue: true
      # Demo shortcut: any unknown card charges the demo customer Amaka. Set to empty to disable.
      - key: DEMO_AUTO_LINK
        value: demo
      # Nigerian voices. Paste your key from yarngpt.ai in the Render dashboard.
      - key: YARNGPT_API_KEY
        sync: false
      # Free phone calls with your own Android phone: any secret word. Open /callcenter?key=WORD and /gateway?key=WORD.
      - key: CALL_BRIDGE_KEY
        sync: false
      # Phone calls through Plivo (free $10 trial credit): fill these in the Render dashboard.
      - key: PLIVO_AUTH_ID
        sync: false
      - key: PLIVO_AUTH_TOKEN
        sync: false
      - key: PLIVO_FROM
        sync: false
      # Or through Vonage (free trial credit): application id and its private key.
      - key: VONAGE_APPLICATION_ID
        sync: false
      - key: VONAGE_PRIVATE_KEY
        sync: false
      # Phone-call approval through Twilio. Fill these in the Render dashboard.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: DEMO_PHONE
        sync: false
      - key: PUBLIC_URL
        value: https://tapnod-demo.onrender.com

databases:
  # Free Render Postgres: 1 GB, expires 30 days after creation (then a 14-day grace period).
  - name: tapnod-db
    plan: free
    databaseName: tapnod
    user: tapnod
